databaseChangeLog:
  - changeSet:
      id: 001-create-person
      author: jdbscript-examples
      changes:
        - createTable:
            tableName: person
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
              - column:
                  name: first_name
                  type: varchar(100)
              - column:
                  name: last_name
                  type: varchar(100)
  - changeSet:
      id: 002-tag-before-full-name-backfill
      author: jdbscript-examples
      changes:
        - tagDatabase:
            tag: before-full-name-backfill
  - changeSet:
      id: 003-add-full-name-column
      author: jdbscript-examples
      changes:
        - addColumn:
            tableName: person
            columns:
              - column:
                  name: full_name
                  type: varchar(200)
  - changeSet:
      id: 004-backfill-full-name
      author: jdbscript-examples
      changes:
        - sql:
            sql: UPDATE person SET full_name = first_name || ' ' || last_name
  - changeSet:
      id: 005-tag-after-full-name-backfill
      author: jdbscript-examples
      changes:
        - tagDatabase:
            tag: after-full-name-backfill
