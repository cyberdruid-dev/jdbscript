databaseChangeLog:
- property:
    name: pk_type_def
    value: bigint
    dbms: "!sqlite"
- property:
    # SQLite's AUTOINCREMENT keyword is only legal on a column declared exactly INTEGER (not
    # BIGINT, even though both share the same storage affinity there).
    name: pk_type_def
    value: integer
    dbms: "sqlite"
- property:
    name: auto_inc
    value: true
    dbms: "!cloudspanner"
- property:
    name: auto_inc
    value: false
    dbms: "cloudspanner"
- property:
    # Liquibase maps "blob" to oid on Postgres; bytea is Postgres' native binary type.
    name: binary_type
    value: bytea
    dbms: "postgresql,cockroachdb"
- property:
    name: binary_type
    value: blob
    dbms: "!postgresql,!cockroachdb"
- include:
    file: db/000-test-schema.yaml
- include:
    file: db/001-multiple_column_types.yaml
- include:
    file: db/002-generated_ids.yaml
- include:
    file: db/003-assertions.yaml
- include:
    file: db/004-cleanup_order_tables.yaml
