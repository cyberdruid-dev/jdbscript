databaseChangeLog:
  - changeSet:
      id: 002-generated_ids
      author: Cyber Druid
      changes:
        - createTable:
            tableName: generated_int_id_table
            columns:
              - column:
                  name: generated_id_column
                  type: ${pk_type_def}
                  autoIncrement: ${auto_inc}
                  constraints:
                    primaryKey: true
              - column:
                  name: varchar_column
                  type: varchar(50)
  - changeSet:
      id: 002-standalone_sequence
      author: Cyber Druid
      # Only the DBMS whose cleanup rewinds a standalone sequence to exactly 10000.
      dbms: oracle,postgresql,cockroachdb,db2,hsqldb
      changes:
        - createSequence:
            sequenceName: standalone_seq
            startValue: 1

##NUMBERS:  DECIMAL, DOUBLE, FLOAT, INT, SMALLINT, TINYINT, MEDIUMINT, NUMBER
##STR: CHAR, NCHAR,  VARCHAR
##DATA: BLOB, CLOB
##DATE: DATE, DATETIME, TIME, TIMESTAMP
##OTHER: UUID, XML
