databaseChangeLog:
  - changeSet:
      id: 004-cleanup_order_tables
      author: Junie
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: int
                  constraints:
                    foreignKeyName: fk_orders_customers
                    referencedTableName: customers
                    referencedColumnNames: id
                    nullable: false
              - column:
                  name: order_date
                  type: varchar(20)
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: int
                  constraints:
                    foreignKeyName: fk_order_items_orders
                    referencedTableName: orders
                    referencedColumnNames: id
                    nullable: false
              - column:
                  name: product_name
                  type: varchar(100)
              - column:
                  name: quantity
                  type: int
